[package]
name = "vault"
version = "0.1.0"
description = "Trader Vaults trader vault: PDA-custodied SOL vaults with trade-only trader rights"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# NOTE(api): written against anchor 0.30.1. `token_2022` / `associated_token`
# are in anchor-spl's default features for 0.30 but are listed explicitly so a
# future default-features change cannot silently drop them.
# init-if-needed deliberately NOT enabled: this program never uses it (it is a
# well-known re-initialization footgun and auditors grep for the feature flag).
anchor-lang = { version = "0.30.1" }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
